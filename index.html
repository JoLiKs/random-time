<!doctype html>
<html lang="ru" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Случайное время</title>
<meta name="theme-color" content="#f4f1ea">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='none' stroke='%23222' stroke-width='2'/%3E%3Cpath d='M12 7v5l3 2' fill='none' stroke='%23222' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{--ease:cubic-bezier(.2,.7,.2,1)}
[data-theme=paper]{--bg:#f4f1ea;--fg:#1f1d1a;--muted:#8a847a;--line:#ddd6c9;--card:#fbf9f4;--accent:#b0482f;--font:"Iowan Old Style","Palatino Linotype",Georgia,serif;--num:"Iowan Old Style",Georgia,serif;--w:400;--radius:999px}
[data-theme=night]{--bg:#0e0f11;--fg:#e8e6e1;--muted:#6d6f75;--line:#23252a;--card:#15171a;--accent:#d8b46a;--font:ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;--num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--w:300;--radius:14px}
[data-theme=mist]{--bg:linear-gradient(160deg,#e9eef0,#dfe7e3 60%,#e8e3dc);--fg:#2c3a3a;--muted:#7f8f8c;--line:rgba(44,58,58,.12);--card:rgba(255,255,255,.55);--accent:#4f7d72;--font:ui-sans-serif,-apple-system,"Segoe UI","Helvetica Neue",sans-serif;--num:ui-sans-serif,-apple-system,"Helvetica Neue",sans-serif;--w:250;--radius:22px}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);background-attachment:fixed;color:var(--fg);font-family:var(--font);display:flex;flex-direction:column;align-items:center;min-height:100dvh;transition:background .4s,color .4s;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
header{width:100%;max-width:560px;display:flex;justify-content:flex-end;padding:18px 20px 0}
.ghost{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--muted);transition:color .2s,background .2s}
.ghost:hover{color:var(--fg);background:var(--line)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding:20px;width:100%}
#time{font-family:var(--num);font-weight:var(--w);font-size:clamp(84px,26vw,180px);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1;transition:opacity .25s var(--ease),transform .25s var(--ease)}
[data-theme=paper] #time{font-style:italic}
[data-theme=night] #time{letter-spacing:.02em}
#time.out{opacity:0;transform:translateY(8px)}
#time .colon{color:var(--accent)}
#retry{width:72px;height:72px;border-radius:var(--radius);display:grid;place-items:center;border:1px solid var(--line);background:var(--card);box-shadow:0 1px 0 rgba(0,0,0,.03);transition:transform .2s var(--ease),border-color .2s}
#retry:hover{border-color:var(--accent)}
#retry:active{transform:scale(.94)}
#retry .icon{width:28px;height:28px;transition:transform .5s var(--ease)}
#retry.spin .icon{transform:rotate(360deg)}
[data-theme=mist] #retry{backdrop-filter:blur(10px)}
section.history{width:100%;max-width:560px;padding:0 20px 28px}
.hhead{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px;margin-bottom:10px}
.hhead h2{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hhead .ghost{width:36px;height:36px}
.hhead .ghost .icon{width:18px;height:18px}
#list{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:8px;max-height:30vh;overflow:auto}
#list li{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:15px;padding:6px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);color:var(--fg)}
#list li:first-child{border-color:var(--accent)}
#empty{color:var(--muted);font-size:14px}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--fg);padding:22px;width:min(340px,90vw);font-family:var(--font)}
[data-theme=mist] dialog{background:#f1f4f2}
[data-theme=night] dialog{background:#15171a}
[data-theme=paper] dialog{background:#fbf9f4}
dialog::backdrop{background:rgba(0,0,0,.25);backdrop-filter:blur(2px)}
dialog h3{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:12px;border:1px solid transparent;text-align:left}
.opt:hover{background:var(--line)}
.opt[aria-checked=true]{border-color:var(--accent)}
.sw{width:30px;height:30px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.12)}
.opt small{display:block;color:var(--muted);font-size:12px}
.close{margin-top:14px;width:100%;padding:10px;border-radius:12px;border:1px solid var(--line)}
</style>
</head>
<body>
<header><button class="ghost" id="openSettings" aria-label="Настройки" title="Настройки"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></header>
<main>
  <div id="time" aria-live="polite">--:--</div>
  <button id="retry" aria-label="Обновить" title="Обновить"><svg class="icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
</main>
<section class="history">
  <div class="hhead"><h2>История</h2><button class="ghost" id="reset" aria-label="Сбросить историю" title="Сбросить историю"><svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg></button></div>
  <ul id="list"></ul><p id="empty">Пока пусто</p>
</section>
<dialog id="settings">
  <h3>Стиль</h3>
  <div role="radiogroup" id="themes"></div>
  <button class="close" id="closeSettings">Готово</button>
</dialog>
<script>
(function(){
  var THEMES=[
    {id:'paper',name:'Бумага',desc:'тёплый светлый, антиква',sw:'linear-gradient(135deg,#f4f1ea 50%,#b0482f 50%)',meta:'#f4f1ea'},
    {id:'night',name:'Ночь',desc:'тёмный, моноширинный',sw:'linear-gradient(135deg,#0e0f11 50%,#d8b46a 50%)',meta:'#0e0f11'},
    {id:'mist',name:'Туман',desc:'мягкий шалфей, тонкий шрифт',sw:'linear-gradient(135deg,#dfe7e3 50%,#4f7d72 50%)',meta:'#e3eae7'}
  ];
  var KH='rt.history',KT='rt.theme',MAX=200;
  var $=function(id){return document.getElementById(id)};
  function load(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  var history=load(KH,[]);
  function rand(){var b=new Uint32Array(1);crypto.getRandomValues(b);var m=b[0]%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
  function paint(t){$('time').innerHTML=t.replace(':','<span class="colon">:</span>')}
  function renderHistory(){var l=$('list');l.innerHTML='';history.forEach(function(t){var li=document.createElement('li');li.textContent=t;l.appendChild(li)});$('empty').style.display=history.length?'none':'block';$('reset').disabled=!history.length;$('reset').style.opacity=history.length?1:.35}
  function next(){var t=rand();var el=$('time');el.classList.add('out');setTimeout(function(){paint(t);el.classList.remove('out')},180);history.unshift(t);if(history.length>MAX)history.length=MAX;save(KH,history);renderHistory();var r=$('retry');r.classList.remove('spin');void r.offsetWidth;r.classList.add('spin')}
  function setTheme(id){if(!THEMES.some(function(t){return t.id===id}))id='paper';document.documentElement.dataset.theme=id;save(KT,id);var th=THEMES.filter(function(t){return t.id===id})[0];document.querySelector('meta[name=theme-color]').content=th.meta;Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(b){b.setAttribute('aria-checked',b.dataset.id===id)})}
  var box=$('themes');THEMES.forEach(function(t){var b=document.createElement('button');b.className='opt';b.setAttribute('role','radio');b.dataset.id=t.id;b.innerHTML='<span class="sw" style="background:'+t.sw+'"></span><span>'+t.name+'<small>'+t.desc+'</small></span>';b.onclick=function(){setTheme(t.id)};box.appendChild(b)});
  setTheme(load(KT,'paper'));
  $('retry').onclick=next;
  $('reset').onclick=function(){if(!history.length)return;if(confirm('Сбросить историю?')){history=[];save(KH,history);renderHistory()}};
  $('openSettings').onclick=function(){$('settings').showModal()};
  $('closeSettings').onclick=function(){$('settings').close()};
  $('settings').addEventListener('click',function(e){if(e.target===this)this.close()});
  document.addEventListener('keydown',function(e){if((e.code==='Space'||e.key==='r')&&!$('settings').open&&e.target===document.body){e.preventDefault();next()}});
  renderHistory();next();
})();
</script>
</body>
</html>
